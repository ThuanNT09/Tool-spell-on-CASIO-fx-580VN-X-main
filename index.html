<title>Spell Tool</title>

#input.limit {
    border: 2px solid red !important;
}

.section {
    margin-bottom: 20px;
}

.label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
}

    font-size: 13px;
    opacity: 0.75;
    margin: 6px 0 0;

    display: flex;
    gap: 10px;
    margin-top: 12px;
}

    flex: 1;
}
</style>

</head>
<body>
<p>Model: Casio FX 580 VN X</p>

<div class="section">
  <div class="label-row">
    <b>Text to Spell</b>
    <span id="charCount">0/17</span>
  </div>
  <input id="input" type="text" placeholder="Text to Spell" style="width:100%; border-radius: 5px; font-size: 18px;">
  <p class="hint">Max 1 Line, 17 Text.</p>
</div>

<div class="btn-row">
  <button onclick="compile()">Spell</button>
  </div>

<hr>

<div class="section">
  <h3>Result</h3>
  <textarea id="out" rows="25" style="width: 100%;" readonly></textarea>
</div>

<script>

const input = document.getElementById("input");
const MAX_LEN = 17;
const charCount = document.getElementById("charCount");
const copyBtn = document.getElementById("copyBtn");
let rawOutput = "";

function updateCharCount(){
    const len = input.value.length;
    charCount.textContent = `${Math.min(len, MAX_LEN)}/${MAX_LEN}`;
}

input.addEventListener("input", function() {
    if (this.value.length > MAX_LEN) {
        this.value = this.value.slice(0, MAX_LEN);
        this.classList.add("limit");
    } else {
        this.classList.remove("limit");
    }
    updateCharCount();
});

updateCharCount();

   Muốn đổi cách hiển thị 1 nút (vd "[CALC]" -> "CALC") thì chỉ sửa ở đây.
   Dùng: S(x, alpha, calc)  ->  "[x] [alpha] [CALC]"
   ========================================================================= */

// Nối nhiều nút thành 1 chuỗi, cách nhau bởi dấu cách
const S = (...keys) => keys.join(' ');

const CHARS_LINES = CHARS_TXT.split("\n");

const DATA_SLOTS = ['__', '_!', '!_', '!!'];
const isDigit = ch => /[0-9]/.test(ch);
const isAlpha = ch => /[A-Za-z]/.test(ch);
const isDataSlot = tok => DATA_SLOTS.includes(tok);

function isValidSlot(byte, slot) {
  if (slot.length === 2) {
    if (slot[0] === '!' && !isDigit(byte[0])) return false;
    if (slot[1] === '!' && !isDigit(byte[byte.length - 1])) return false;
  }
  return true;
}

function fillTemplate(template, hexList, hexIndex) {
  const filled = [];
  let i = hexIndex;
  let wp = 0;
  while (wp < template.length) {
    const part = template[wp];
    if (isDataSlot(part)) {
      if (i >= hexList.length) return { filled, i, done: true };
      const raw = hexList[i];
      const bytesPair = raw.split(' ').filter(Boolean);
      if (bytesPair.length === 2) {
        const [b1, b2] = bytesPair;
        const nextPart = wp + 1 < template.length ? template[wp + 1] : null;
        if (nextPart !== null && isDataSlot(nextPart) && isValidSlot(b1, part) && isValidSlot(b2, nextPart)) {
          filled.push(b1); filled.push(b2);
          i += 1; wp += 2; continue;
        } else {
          filled.push('20'); wp += 1; continue;
        }
      }
      const byte = raw;
      if (isValidSlot(byte, part)) {
        filled.push(byte); i += 1; wp += 1; continue;
      } else {
        filled.push('20'); wp += 1; continue;
      }
    } else {
      if (i >= hexList.length) return { filled, i, done: true };
      filled.push(part); wp += 1;
    }
  }
  return { filled, i, done: i >= hexList.length };
}

const CHARST = ['a','b','c','d','e','f','g','j','k','L','M','N','O','T','U','V','W','X','Y','Z'];
const J = [
  ..."abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ",
  '!','"','#',' ',
  ..."0123456789"
];

function spellVarVn(line) {
  // Lấy các nút ra thành biến riêng để dùng trong hàm này
  const {
    x, alpha, calc, shift, menu, ac, del, eq, dot, neg, lpar, rpar,
    integral, exp10, plus, dms, recip, left, right, up, down,
    n0, n1, n2, n3, n4, n5, n6, n7, n8, n9,
  } = KEYS;
  const DIGITS = [n0, n1, n2, n3, n4, n5, n6, n7, n8, n9];

  let buf = '';
  const P = (text = '', end = '\n') => { buf += text + end; };
  // Tiêu đề mỗi bước: đường kẻ + tên bước
  const H = (title) => { P(); P('━━━━━━━━━━━━━━━━━━━━━━━━'); P(title); };

  const charList = [];
  let char1 = [];
  let ds = line.split('');
  const originalLine = line;
  const hexList = [];
  const foundKeys = {};

  if (line.length > 17) {
    P("Câu bạn vừa nhập quá 1 dòng (17 kí tự) ! ");
    return buf;
  }

  // ---- Thu thập kí tự đặc biệt (không gõ được bằng bàn phím) ----
  const neededChars = [];
  for (const ch of line) neededChars.push(ch === ' ' ? 'Space' : ch);

  for (const a of line) {
    if (CHARST.includes(a)) charList.push(a);
    if (!J.includes(a)) charList.push(a);
  }

  const missingChars = [];
  const hexMap = [];
  for (const char of charList) {
    let found = false;
    for (let raw of CHARS_LINES) {
      const ln = raw.trim();
      const parts = ln.split(" : ");
      if (parts.length >= 2 && parts[1] === char) {
        hexMap.push(`${char} = ${parts[0]}`);
        found = true;
        hexList.push(parts[0]);
        break;
      }
    }
    if (!found && !missingChars.includes(char)) missingChars.push(char);
  }

  // Có kí tự không tồn tại trong chars.txt -> chỉ báo lỗi, không in gì thêm
  if (missingChars.length > 0) {
    return `LỖI: không tìm thấy kí tự ${missingChars.map(c => `'${c}'`).join(', ')}.`;
  }

  for (let raw of CHARS_LINES) {
    const ln = raw.trim();
    if (ln.includes(" : ")) {
      const parts = ln.split(" : ");
      if (parts.length === 3) {
        const [hexCode, char, button] = parts;
        if (ds.includes(char)) foundKeys[char] = button;
      }
    }
  }

  const c = ds.length;
  const space = 17 - c;
  if (space % 2 === 0) {
    const a = space / 2;
    ds = Array(a).fill(' ').concat(ds).concat(Array(a).fill(' '));
  } else {
    const a = (space - 1) / 2;
    const b = a + 1;
    ds = Array(b).fill(' ').concat(ds).concat(Array(a).fill(' '));
  }
  const strSpell = ds.join('');

  P(`Kí tự cần: ${neededChars.join(' ')}`);
  P(`Kí tự lấy qua Biến: ${charList.length ? charList.join(' ') : '(không có)'}`);
  if (hexMap.length) P(` hex: ${hexMap.join(' · ')}\n`);
  P(`Hiển thị: ${strSpell.replace(/ /g, '\\')}`);
  P();
  P(`Ký hiệu: ${down} xuống · ${left} trái · ${right} phải · ${up} lên`);

  for (const b of hexList) {
    for (const ch of b) {
      if (isAlpha(ch)) char1.push(ch);
    }
  }
  char1.push('C');
  hexList.push("3C");
  hexList.push("23");

  // ---- Tính trước việc nhồi hex vào biến A, B, C ----
  // Nếu không đủ chỗ thì chỉ báo lỗi, không in gì thêm.
  const template_A = ['1.0000', '__', '__', '_!', '!_', '__', '×10', '!!'];
  const template_B = ['1.', '__', '__', '__', '__', '_!', '!_', '__', '×10', '!!'];
  const template_C = ['1.', '__', '__', '__', '__', '_!', '!_', '__', '×10', '!!'];

  const filledOutputs = [];
  let hexIndex = 0;
  let listLo = [];
  let overflowed = true;
  for (const [label, template] of [['A', template_A], ['B', template_B], ['C', template_C]]) {
    const { filled: result, i: newIndex, done } = fillTemplate(template, hexList, hexIndex);
    hexIndex = newIndex;
    filledOutputs.push(`${label} = ${result.join(' ')}`);
    for (const z of result) listLo.push(z);
    if (done) { overflowed = false; break; }
  }

  if (overflowed) {
    return `LỖI: câu này cần nhiều hex hơn cả 3 biến A, B, C chứa được (còn dư ${hexList.length - hexIndex} byte hex chưa nhồi hết). Vui lòng thử câu ngắn hơn hoặc ít kí tự đặc biệt hoặc kí tự tiếng Việt hơn.`;
  }

  // ---- BƯỚC 1-3 ----
  H('BƯỚC 1 · Reset máy');
  P(S(shift, n9, n3, eq, eq));

  H('BƯỚC 2 · Vào LineI/O');
  P(S(shift, menu, n1, n3));

  H('BƯỚC 3 · Basic Overflow');
  P(S(
    x, alpha, calc, shift, x, x, shift, rpar, n9, shift, rpar, n9, n9, n9,
    calc, eq, ac, left, del, del, calc, eq, left, shift, dot
  ));

  // ---- BƯỚC 4 ----
  const HEX_DIGIT_KEYS = {
    "A": S(shift, n7, n3, n7),
    "B": S(shift, n7, n3, n8),
    "C": S(shift, n7, n3, n9),
    "D": S(shift, n7, n3, neg),
    "E": S(shift, n7, n3, dms),
    "F": S(shift, n7, n3, recip),
  };
  const keySequence = char1.map(ch => HEX_DIGIT_KEYS[ch] || '').join(' ');
  H('BƯỚC 4 · Lấy kí tự cần thiết và Gán biến');
  P(keySequence);
  P(`(${S(left, n9, del)})×${char1.length} ${del}×10 ${S(alpha, integral)}`);
  P();
  P("Màn hình Casio hiển thị:");
  P("x:");

  const variablesPrinted = new Set();
  for (const ln of filledOutputs) {
    if (ln.includes('=')) variablesPrinted.add(ln.split('=')[0].trim());
  }

  filledOutputs.forEach((ln, idx) => {
    if (idx === filledOutputs.length - 1) P(ln);
    else P(ln + ':');
  });

  const VAR_SELECT_KEYS = {
    'A': S(alpha, neg),
    'B': S(alpha, dms),
    'C': S(alpha, recip),
  };
  P();
  P("Cách nhập từng biến:");
  filledOutputs.forEach((ln, idx) => {
    let [label, value] = ln.split(/=(.*)/s);
    label = label.trim(); value = value.trim();
    const isLast = idx === filledOutputs.length - 1;
    const keys = [VAR_SELECT_KEYS[label] || "", S(alpha, calc)];
    for (const token of value.split(' ')) {
      if (token === "×10") {
        keys.push(exp10);
      } else {
        for (const ch of token) {
          if (isDigit(ch)) keys.push(DIGITS[ch]);
          else if (ch === '.') keys.push(dot);
          else if (isAlpha(ch)) keys.push(right);
        }
      }
    }
    if (!isLast) keys.push(S(alpha, integral));
    P(`• ${keys.filter(Boolean).join(' ')}`);
  });
  P();
  P(`Rồi bấm: ${calc} (${eq})×${variablesPrinted.size + 1} lần`);

  // ---- BƯỚC 5 ----
  H('BƯỚC 5 · Vào mode 100an');
  P(S(
    x, alpha, calc, shift, x, x, shift, rpar, n9, shift, rpar, n9, calc, eq,
    left, shift, dot, shift, dot, left, left, del, down, shift, n8, down,
    n2, n6, left, left, right, n9, del, left, rpar, plus
  ) + ' [100 số bất kì]');
  P(S(calc, eq));

  // ---- BƯỚC 6 ----
  const n = variablesPrinted.size;
  const atSigns = "@".repeat(n);
  H(`BƯỚC 6 · Lấy "${atSigns}"`);
  const PRE_KEYS = [
    S(shift, n7, n4, n8),
    S(shift, n7, n4, n9),
    S(shift, n7, n1, n4),
  ];
  const VAR_NAMES = ['A', 'B', 'C'];
  P(S(
    x, alpha, calc, shift, x, x, shift, rpar, n9, shift, rpar, n9, calc, eq,
    left, shift, dot, ...PRE_KEYS.slice(0, n)
  ));
  P(`(${S(left, n9, del)})×${n}`);
  P();
  P("Màn hình Casio hiển thị:");
  P("123456789x:");
  for (let k = 0; k < n; k++) {
    P(`@=${VAR_NAMES[k]}${k < n - 1 ? ':' : ''}`);
  }
  P();
  P("Cách làm:");
  let step6 = S(
    `${del}×10`, left, n1, n2, n3, n4, n5, n6, n7, n8, n9, right,
    alpha, integral, right, alpha, calc, alpha, neg
  );
  for (let k = 1; k < n; k++) {
    step6 += ' ' + S(alpha, integral, right, alpha, calc, VAR_SELECT_KEYS[VAR_NAMES[k]]);
  }
  P(step6);
  P(`${calc} (${eq})×${n + 1} ${up}`);

  // ---- BƯỚC 7 ----
  H('BƯỚC 7 · Xóa Byte thừa');
  let count = 0;
  listLo = listLo.slice().reverse();
  let buf7 = '';
  for (const i of listLo) {
    if (i === '20') {
      if (count === 0) buf7 += `${del} `;
      else buf7 += `${left}x${count} ${del} `;
      count = 0;
    } else if (i === '1.') {
      if (count === 0) buf7 += `${del}x2 `;
      else buf7 += `${left}x${count} ${del}x2 `;
      count = 0;
    } else if (i === '1.0000') {
      if (count !== 0) buf7 += `${left}x${count} `;
      count = 0;
    } else if (i === '×10') {
      // bỏ qua
    } else if (i === 'F4') {
      // bỏ qua
    } else {
      count += 1;
    }
  }
  P(buf7.replace(/\s+$/,'') + ` ${left}x5`);

  // ---- BƯỚC 8 ----
  H('BƯỚC 8 · Gán kí tự và hoàn thiện Hackstring');
  const keys8 = [];
  for (const char of ds) {
    if (char in foundKeys) {
      keys8.push(`${foundKeys[char]}`);
    }
    if (!(char in foundKeys)) {
      if (char === " ") keys8.push(S(shift, n8, n3, n4));
      if (!J.includes(char)) keys8.push(right);
      if (J.includes(char)) {
        if (CHARST.includes(char)) keys8.push(right);
      }
    }
  }
  P(keys8.join(' '));

  const realSpaceCount = (originalLine.match(/ /g) || []).length;
  let specialCharCount = 0;
  for (const ch of originalLine) if (!J.includes(ch)) specialCharCount++;
  const nValue = originalLine.length - realSpaceCount - specialCharCount;
  P(`[${nValue} số bất kì] ${S(shift, lpar, right, n2, x)}`);

  // ---- BƯỚC CUỐI ----
  H('BƯỚC CUỐI');
  P(S(calc, eq));

  return buf;
}

function cleanOutput(text) {
  return text
    .split('\n')
    .map(line => {
      // gom nhiều dấu cách liên tiếp thành 1, xoá dấu cách thừa ở đầu/cuối dòng
      return line.replace(/[ \t]{2,}/g, ' ').trim();
    })
    .join('\n')
    // gom nhiều dòng trống liên tiếp thành tối đa 1 dòng trống
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function compile() {
  const code = input.value;
  const outEl = document.getElementById("out");
  if (!code) {
    outEl.value = "";
    rawOutput = "";
    if (copyBtn) copyBtn.disabled = true;
    return;
  }
  rawOutput = cleanOutput(spellVarVn(code));
  outEl.value = rawOutput;
  if (copyBtn) copyBtn.disabled = !rawOutput;
}
